[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-recognizer"
version = "0.1.0"
description = "Physics-aware multimodal fusion for fraud detection in automated reverse-vending machines"
requires-python = ">=3.10"
dependencies = [
    # Data processing
    "pycocotools>=2.0.8",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    # Dataset downloading
    "gdown>=4.7",
    "kaggle>=1.6",
    "requests>=2.31",
    "roboflow>=1.1",
    # Visualization / reporting
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
]
dev = [
    "ipykernel",
    "jupyter",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]